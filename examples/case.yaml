org: alphacorp
operation: atlas
assignments:
  - {user: ana, role: vendor, org: alphacorp, operation: atlas, start: 2026-01-01}
  - {user: luis, role: vendor, org: alphacorp, operation: atlas, start: 2026-01-01}
  - {user: sofia, role: senior_legal, org: alphacorp, operation: atlas, start: 2026-01-01}
  - {user: ines, role: procurement, org: alphacorp, operation: atlas, start: 2026-01-01}
names: {ana: Ana, luis: Luis, ines: Inés, sofia: Sofía}
clauses:
  deadline:
    text: El trámite vence el viernes.
    facts: [[o17, deadline, friday]]
    provides: [answer_deadline]
  identify:
    text: El expediente O-17 corresponde a BetaAI.
    facts: [[o17, counterparty, betaai]]
  explicit:
    text: La oferta para BetaAI está firmada.
    facts: [[betaai, offer_status, signed]]
    provides: [answer_signature]
  # Harmless alone: it does not name the counterparty. Combined with "identify" it reveals offer_status.
  record:
    text: El expediente O-17 ya está firmado.
    facts: [[o17, signature, signed]]
    provides: [answer_record]
tasks:
  due:
    requires: [answer_deadline]
    options:
      - {clauses: [deadline, identify]}
      - {clauses: [deadline]}
  signature:
    requires: [answer_signature]
    options:
      - {clauses: [explicit]}
  record:
    requires: [answer_record]
    options:
      - {clauses: [record]}
